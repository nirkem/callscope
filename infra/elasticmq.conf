# ElasticMQ: an SQS-compatible queue that runs locally. Code talks to it with the normal AWS SDK;
# only the endpoint URL differs from real SQS.
include classpath("application.conf")

node-address {
  protocol = http
  # "*" builds queue URLs from the request's host, so they work from the host machine and from containers.
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  # Messages that failed 3 times end up here, so nothing is lost and they can be inspected.
  conversation-completed-dlq {}

  conversation-completed {
    # A received message stays hidden this long. If it isn't deleted by then, it comes back for another try.
    defaultVisibilityTimeout = 20 seconds
    deadLettersQueue {
      name = "conversation-completed-dlq"
      maxReceiveCount = 3
    }
  }
}
