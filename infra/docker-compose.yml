# Run from this folder:  docker compose up --build
name: callscope

services:
  sqs:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "9324:9324"  # SQS API
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro

  analysis-service:
    build: ../analysis-service
    ports:
      - "8000:8000"
    environment:
      CALLSCOPE_MODELS: real  # "fake" starts instantly, with keyword classifiers
    volumes:
      - model-cache:/home/appuser/.cache/huggingface  # models survive restarts and rebuilds
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10m  # the first start downloads ~2 GB of models; later starts take seconds

  conversation-service:
    build: ../conversation-service
    ports:
      - "8080:8080"
    environment:
      # Inside Docker, the other containers are reached by their service names.
      SQS_ENDPOINT: http://sqs:9324
      ANALYSIS_SERVICE_URL: http://analysis-service:8000
      CALLSCOPE_DEMO_ENABLED: "true"  # the dashboard's "Simulate a batch" button
    depends_on:
      sqs:
        condition: service_started
      analysis-service:
        condition: service_healthy  # start consuming only once the models are loaded

volumes:
  model-cache:
