[project]
name = "callscope-analysis-service"
version = "0.1.0"
description = "Sentiment and empathy analysis for contact-center conversations."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# The real models (day 2). Kept separate so tests and CI run without a multi-GB download.
ml = [
    "transformers>=4.44",
    "torch>=2.4",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # FastAPI's TestClient needs it
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Install the dependencies only. The code runs from this folder, not from site-packages.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# The app folders have no __init__.py, so tell mypy that "app" starts at this folder.
explicit_package_bases = true
